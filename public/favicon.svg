<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark rounded background -->
  <rect width="32" height="32" rx="8" fill="#1c1c1c"/>

  <!-- Orange accent glow -->
  <rect width="32" height="32" rx="8" fill="url(#glow)" opacity="0.3"/>

  <!-- TV/screen icon centered -->
  <!-- Screen body -->
  <rect x="5" y="8" width="22" height="14" rx="2.5" fill="none" stroke="#FF6B01" stroke-width="2"/>

  <!-- Screen inner highlight -->
  <rect x="7.5" y="10.5" width="17" height="9" rx="1.5" fill="#FF6B01" opacity="0.15"/>

  <!-- Play triangle -->
  <polygon points="13,13.5 13,18.5 19,16" fill="#FF6B01"/>

  <!-- Stand stem -->
  <rect x="15" y="22" width="2" height="3" rx="1" fill="#FF6B01" opacity="0.7"/>

  <!-- Stand base -->
  <rect x="11" y="25" width="10" height="2" rx="1" fill="#FF6B01" opacity="0.7"/>

  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6B01"/>
      <stop offset="100%" stop-color="#FF6B01" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
